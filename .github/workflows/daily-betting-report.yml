name: Daily Betting Report

on:
  schedule:
    - cron: "0 12 * * *"  # 09:00 BRT (UTC-3) - GitHub Actions cron e sempre em UTC
  workflow_dispatch: {}  # permite disparo manual (aba Actions -> Run workflow)

permissions:
  contents: write  # necessario pra commitar o relatorio de volta no repo

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/daily_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Nada novo em reports/ - nada pra commitar."
          else
            git commit -m "Relatorio diario de betting - $(date -u +%F)"
            git push
          fi
